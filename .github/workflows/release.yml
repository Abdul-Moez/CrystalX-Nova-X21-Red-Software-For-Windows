# CrystalX Nova X21 mouse for Windows
# Copyright (C) 2026 Abdul Moez (https://github.com/Abdul-Moez)
# SPDX-License-Identifier: GPL-3.0-or-later -- see the LICENSE file.
#
# Builds CrystalX-Nova-X21-Setup-<version>.exe and publishes it as a GitHub
# release.
#
#   Release:     push a version tag that matches VERSION in mouse_win.py
#                  git tag v1.0.0
#                  git push origin v1.0.0
#   Test build:  Actions tab -> Release -> Run workflow. Builds the installer
#                as a downloadable artifact; publishes nothing.
#
# The build itself is packaging\build.cmd, the same script that builds the app
# on a PC, so the two cannot drift apart. It downloads Inno Setup and checks
# its fingerprint and signature; the address and fingerprint live there.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write     # to create the release

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the Python and the version
        id: version
        shell: pwsh
        run: |
          # 3.13.0 builds the app without its settings window (see build.cmd).
          python -c "import sys; assert sys.version_info[:3] != (3, 13, 0), 'Python 3.13.0 is not allowed'"
          if ($LASTEXITCODE) { exit 1 }
          $version = (Select-String -Path mouse_win.py -Pattern '^VERSION = "([\d.]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag $env:GITHUB_REF_NAME does not match VERSION = `"$version`" in mouse_win.py"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building version $version with $(python --version)"

      - name: Build the app and the installer
        shell: cmd
        run: packaging\build.cmd "%pythonLocation%\python.exe"

      - name: Check and fingerprint the installer
        id: installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $name = "CrystalX-Nova-X21-Setup-$version.exe"
          if (-not (Test-Path "dist\$name")) { throw "dist\$name was not built" }
          # Without tkinter the app would have no settings window.
          if (-not (Test-Path "dist\CrystalX Nova X21\_internal\_tkinter.pyd")) {
            throw "The app was built without tkinter"
          }
          $sha256 = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$sha256  $name" | Out-File "dist\$name.sha256" -Encoding ascii -NoNewline
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
          "$name  $sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: CrystalX-Nova-X21-Setup-${{ steps.version.outputs.version }}
          path: |
            dist/${{ steps.installer.outputs.name }}
            dist/${{ steps.installer.outputs.name }}.sha256

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $name = "${{ steps.installer.outputs.name }}"
          @"
          ## Install

          1. Close the vendor's **NOVA X21 Red** app if it is running.
          2. Download **$name** below.
          3. Run it. Windows may say "Windows protected your PC" because the installer is not
             code-signed: click **More info**, then **Run anyway**.
          4. Follow the steps. Windows does not ask for an administrator.

          The battery icon appears next to the clock and the settings window opens.
          Full instructions: [README](https://github.com/${{ github.repository }}#readme)

          ## Check the download

          SHA-256 of ``$name``:

          ``````
          ${{ steps.installer.outputs.sha256 }}
          ``````

          In PowerShell: ``Get-FileHash $name``
          "@ | Out-File release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "dist\$name" "dist\$name.sha256" `
            --title "CrystalX Nova X21 $version" --notes-file release-notes.md
